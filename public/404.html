<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sayfa bulunamadı | Organizasyon Sepeti</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/assets/css/site.css" />
    <style>
      .nf {
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }
      .nf h1 {
        font-family: var(--font-display);
        font-size: clamp(5rem, 18vw, 9rem);
        font-weight: 500;
        font-style: italic;
        color: var(--accent);
        line-height: 1;
      }
      .nf p {
        margin: 12px 0 30px;
        color: var(--ink-soft);
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <main class="nf">
      <div>
        <h1>404</h1>
        <p>Aradığınız sayfa bulunamadı. Belki balonlarla birlikte uçup gitmiştir.</p>
        <a class="btn btn-primary" href="/">Ana sayfaya dön</a>
      </div>
    </main>
  </body>
</html>
