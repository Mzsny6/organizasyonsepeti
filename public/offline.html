<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#6c5ce7" />
    <title>İnternet bağlantısı yok | Organizasyon Sepeti</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f8f9fa;
        color: #2d3436;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 420px;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: #636e72;
        line-height: 1.6;
      }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #6c5ce7;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/img/icon-192.png" alt="" />
      <h1>İnternet bağlantısı yok</h1>
      <p>Bu sayfayı açmak için internete bağlanmanız gerekiyor. Bağlantınız gelince tekrar deneyin.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
  </body>
</html>
